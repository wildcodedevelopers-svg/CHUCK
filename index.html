<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020611">
<title>C.H.U.C.K. | AI Core</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap');

:root {
    --blue: #087dff;
    --cyan: #00eaff;
    --bg: #020611;
    --muted: #6589ad;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: #e9f8ff;
    font-family: Inter, sans-serif;
}

body {
    height: 100dvh;
    min-height: 100%;
    overscroll-behavior: none;
}

button, input {
    font: inherit;
}

button {
    cursor: pointer;
}

/* FULL-SCREEN SPACE */

.space {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 45%, #09244a 0%, #041329 35%, transparent 68%),
        radial-gradient(ellipse at 10% 90%, #06152b, transparent 50%),
        #020611;
}

.grid {
    position: absolute;
    inset: 0;
    opacity: .22;
    background-image:
        linear-gradient(rgba(0,180,255,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,180,255,.07) 1px, transparent 1px);
    background-size: 35px 35px;
    mask-image: radial-gradient(ellipse, black, transparent 85%);
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #b5f5ff;
    box-shadow: 0 0 7px #00bfff;
    animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
    from { opacity: .15; transform: scale(.7); }
    to { opacity: .95; transform: scale(1.5); }
}

.ambient {
    position: absolute;
    width: 60vw;
    height: 60vw;
    max-width: 440px;
    max-height: 440px;
    border-radius: 50%;
    background: #006eff;
    filter: blur(110px);
    opacity: .13;
    top: 23%;
    left: 20%;
    animation: ambientPulse 5s ease-in-out infinite alternate;
}

@keyframes ambientPulse {
    to { opacity: .27; transform: scale(1.15); }
}

/* TOP BAR */

.topbar {
    position: absolute;
    z-index: 10;
    top: 0;
    left: 0;
    right: 0;
    padding: max(env(safe-area-inset-top), 14px) 20px 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(0,190,255,.16);
    background: linear-gradient(#020611d9, #02061138);
}

.logo {
    font-family: Orbitron, sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 3px;
    text-shadow: 0 0 15px #008cff;
}

.logo span {
    color: var(--cyan);
}

.subtitle {
    margin-top: 4px;
    font-size: 8px;
    color: #6f9bc0;
    letter-spacing: 2px;
}

.connection {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 9px;
    letter-spacing: 1.2px;
    color: #9ac9ed;
}

.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #00e6a0;
    box-shadow: 0 0 10px #00e6a0;
}

.dot.busy {
    background: #ffc65b;
    box-shadow: 0 0 10px #ffc65b;
}

/* THE ORB OWNS THE SCREEN */

.orb-zone {
    position: absolute;
    top: 65px;
    bottom: 155px;
    left: 0;
    right: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    transition: bottom .25s ease;
}

.orb-stage {
    position: relative;
    width: min(94vw, 480px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    perspective: 1000px;
    isolation: isolate;
    transform: translateY(-2%);
}

.halo {
    position: absolute;
    width: 55%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #007bff;
    filter: blur(65px);
    opacity: .38;
    animation: halo 3s ease-in-out infinite alternate;
}

@keyframes halo {
    to { opacity: .75; transform: scale(1.23); }
}

/* Planet */

.planet {
    position: absolute;
    width: 34%;
    aspect-ratio: 1;
    border-radius: 50%;
    z-index: 4;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 25% 20%, #ffffff 0%, #a8faff 3%, #35d8ff 10%, transparent 34%),
        radial-gradient(ellipse at 30% 25%, #53dfff 0%, #087cff 27%, #0642a7 52%, #031638 79%, #01040c 100%);
    box-shadow:
        inset -18px -12px 27px #01040b,
        inset 5px 5px 16px rgba(255,255,255,.75),
        0 0 18px #00cfff,
        0 0 45px #007bff,
        0 0 100px rgba(0,110,255,.7);
    animation: planetGlow 4s ease-in-out infinite alternate;
}

.planet::before {
    content: "";
    position: absolute;
    inset: -10%;
    border-radius: 50%;
    background: repeating-linear-gradient(
        165deg,
        transparent 0 7px,
        rgba(0,235,255,.32) 8px,
        transparent 10px 17px
    );
    mix-blend-mode: screen;
}

.planet::after {
    content: "";
    position: absolute;
    top: 35%;
    left: -20%;
    width: 140%;
    height: 17%;
    transform: rotate(-24deg);
    background: linear-gradient(
        90deg,
        transparent,
        rgba(0,234,255,.7),
        white,
        #008cff,
        transparent
    );
    filter: blur(7px);
}

@keyframes planetGlow {
    to { filter: brightness(1.3); }
}

/* FOUR DIFFERENT ORBITAL RINGS */

.ring {
    position: absolute;
    left: 50%;
    top: 50%;
    border: 2px solid transparent;
    border-radius: 50%;
    transform-style: preserve-3d;
    pointer-events: none;
}

.ring-a {
    width: 87%;
    height: 31%;
    z-index: 3;
    margin: -15.5% 0 0 -43.5%;
    border-top-color: #eaffff;
    border-left-color: #00eaff;
    border-right-color: #087dff;
    box-shadow: 0 0 10px #00bfff, inset 0 0 9px #087dff;
    animation: orbitA 12s linear infinite;
}

.ring-b {
    width: 91%;
    height: 35%;
    z-index: 5;
    margin: -17.5% 0 0 -45.5%;
    border-top-color: rgba(0,234,255,.95);
    border-right-color: #d5ffff;
    border-bottom-color: transparent;
    border-left-color: #126bff;
    box-shadow: 0 0 13px rgba(0,205,255,.8);
    animation: orbitB 16s linear infinite;
}

.ring-c {
    width: 99%;
    height: 43%;
    z-index: 2;
    margin: -21.5% 0 0 -49.5%;
    border-top-color: #00dfff;
    border-left-color: #7beaff;
    border-right-color: #087dff;
    box-shadow: 0 0 10px rgba(0,140,255,.6);
    animation: orbitC 19s linear infinite;
}

.ring-d {
    width: 75%;
    height: 47%;
    z-index: 6;
    margin: -23.5% 0 0 -37.5%;
    border-top-color: rgba(255,255,255,.9);
    border-left-color: #00bfff;
    border-bottom-color: #086bff;
    box-shadow: 0 0 10px rgba(0,234,255,.6);
    animation: orbitD 23s linear infinite;
}

@keyframes orbitA {
    from { transform: rotate(-23deg) rotateX(68deg) rotateZ(0); }
    to { transform: rotate(-23deg) rotateX(68deg) rotateZ(360deg); }
}

@keyframes orbitB {
    from { transform: rotate(34deg) rotateX(66deg) rotateZ(0); }
    to { transform: rotate(34deg) rotateX(66deg) rotateZ(-360deg); }
}

@keyframes orbitC {
    from { transform: rotate(72deg) rotateX(72deg) rotateZ(0); }
    to { transform: rotate(72deg) rotateX(72deg) rotateZ(360deg); }
}

@keyframes orbitD {
    from { transform: rotate(-62deg) rotateX(66deg) rotateZ(0); }
    to { transform: rotate(-62deg) rotateX(66deg) rotateZ(-360deg); }
}

.orb-stage.listening .halo {
    opacity: .9;
    filter: blur(85px);
}

.orb-stage.listening .planet {
    box-shadow: 0 0 35px #00eaff, 0 0 80px #008cff, 0 0 140px #006bff;
}

.orb-stage.thinking .planet {
    animation: thinkingPulse .65s ease-in-out infinite alternate;
}

@keyframes thinkingPulse {
    to { transform: scale(1.12); filter: brightness(1.5); }
}

/* STATUS FLOATING UNDER THE ORB */

.core-info {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 16px;
    text-align: center;
    pointer-events: none;
}

.core-title {
    font-family: Orbitron, sans-serif;
    font-size: clamp(10px, 2.7vw, 13px);
    letter-spacing: 4px;
    color: #d7f8ff;
    text-shadow: 0 0 18px #008cff;
}

.core-status {
    margin-top: 9px;
    font-size: 9px;
    letter-spacing: 2px;
    color: #70b4e9;
}

.core-line {
    height: 1px;
    width: 80px;
    margin: 13px auto 0;
    background: linear-gradient(90deg, transparent, #00cfff, transparent);
    box-shadow: 0 0 8px #008cff;
}

/* CHAT FLOATS ABOVE THE BOTTOM CONTROLS */

.chat-feed {
    position: absolute;
    z-index: 7;
    left: 15px;
    right: 15px;
    bottom: calc(143px + env(safe-area-inset-bottom));
    max-width: 520px;
    margin: auto;
    max-height: 25dvh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: none;
    mask-image: linear-gradient(transparent, black 8%, black);
    pointer-events: none;
}

.chat-feed::-webkit-scrollbar {
    display: none;
}

.message {
    align-self: flex-start;
    max-width: 90%;
    padding: 9px 12px;
    border: 1px solid rgba(0,190,255,.25);
    border-radius: 3px 11px 11px 11px;
    background: rgba(3,17,36,.89);
    backdrop-filter: blur(12px);
    box-shadow: 0 0 18px rgba(0,100,255,.09);
    font-size: 12px;
    line-height: 1.55;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    animation: appear .2s ease-out;
}

.message.user {
    align-self: flex-end;
    border-color: rgba(0,150,255,.5);
    background: rgba(4,41,83,.91);
}

.msg-label {
    display: block;
    margin-bottom: 4px;
    color: #00dfff;
    font-family: Orbitron, sans-serif;
    font-size: 8px;
    letter-spacing: 1px;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.typing {
    align-self: flex-start;
    color: #79cfff;
    font-size: 11px;
    padding: 9px;
    background: rgba(3,17,36,.9);
    border-radius: 8px;
}

.typing span {
    display: inline-block;
    width: 4px;
    height: 4px;
    margin-left: 4px;
    border-radius: 50%;
    background: var(--cyan);
    animation: blink .7s infinite alternate;
}

.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }

@keyframes blink {
    to { opacity: .2; transform: translateY(-3px); }
}

/* BOTTOM COMMAND DECK */

.bottom {
    position: absolute;
    z-index: 12;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 12px 15px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(
        to bottom,
        rgba(2,6,17,.1),
        rgba(2,6,17,.92) 18%,
        #020611 55%
    );
    border-top: 1px solid rgba(0,180,255,.16);
}

.bottom-inner {
    width: 100%;
    max-width: 520px;
    margin: auto;
}

.command-label {
    margin: 0 0 9px 3px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #6e9dbf;
    font-size: 8px;
    letter-spacing: 2px;
}

.command-label strong {
    color: #00cfff;
    font-weight: 500;
}

.input-row {
    display: flex;
    align-items: center;
    gap: 8px;
}

.input-wrap {
    height: 49px;
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    border: 1px solid rgba(0,173,255,.34);
    border-radius: 11px;
    background: rgba(6,20,41,.96);
    box-shadow: inset 0 0 18px rgba(0,90,255,.07);
}

#userInput {
    width: 100%;
    min-width: 0;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #e9f9ff;
    padding: 0 12px;
    font-size: 12px;
}

#userInput::placeholder {
    color: #527493;
}

.btn {
    height: 49px;
    width: 47px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    color: #b9efff;
    background: linear-gradient(145deg, #0b2a4d, #061225);
    border: 1px solid rgba(0,185,255,.4);
    border-radius: 11px;
    font-size: 19px;
    transition: .18s;
}

.btn:active {
    transform: scale(.94);
    box-shadow: 0 0 18px #008cff;
}

.btn.send {
    background: linear-gradient(135deg, #078fff, #064ac0);
    color: white;
    box-shadow: 0 0 15px rgba(0,119,255,.28);
}

.btn.active {
    background: #064db5;
    color: white;
    box-shadow: 0 0 22px #008cff;
    animation: micGlow 1s infinite alternate;
}

@keyframes micGlow {
    to { box-shadow: 0 0 27px #00eaff; }
}

.tools-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
}

.tool {
    min-height: 34px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid rgba(0,155,255,.18);
    border-radius: 8px;
    background: rgba(5,19,38,.8);
    color: #79a9cf;
    font-size: 9px;
    letter-spacing: .6px;
}

.tool.active {
    color: #00eaff;
    border-color: rgba(0,234,255,.6);
    background: rgba(0,94,177,.2);
}

.footer {
    text-align: center;
    margin-top: 10px;
    color: #3f6385;
    font-size: 8px;
    letter-spacing: 1.5px;
}

.footer span {
    color: #70baff;
}

@media (max-height: 650px) {
    .orb-zone { top: 55px; bottom: 140px; }
    .orb-stage { width: min(76vw, 340px); }
    .core-info { bottom: 4px; }
    .chat-feed { max-height: 19dvh; bottom: calc(132px + env(safe-area-inset-bottom)); }
    .bottom { padding-top: 7px; }
    .btn, .input-wrap { height: 43px; }
    .btn { width: 43px; }
    .tools-row { margin-top: 6px; }
    .tool { min-height: 29px; }
    .footer { margin-top: 5px; }
}

@media (min-width: 700px) {
    .orb-stage { width: min(65vw, 510px); }
    .chat-feed { left: 50%; transform: translateX(-50%); width: min(520px, 90vw); }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="space">
    <div class="grid"></div>
    <div class="ambient"></div>
    <div id="stars"></div>
</div>

<header class="topbar">
    <div>
        <div class="logo">C<span>.</span>H<span>.</span>U<span>.</span>C<span>.</span>K</div>
        <div class="subtitle">CRAIG'S AI COMMAND SYSTEM</div>
    </div>
    <div class="connection">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">CORE ONLINE</span>
    </div>
</header>

<!-- LARGE FULL-SCREEN ORB -->

<section class="orb-zone">
    <div class="orb-stage" id="orbStage">
        <div class="halo"></div>
        <div class="ring ring-c"></div>
        <div class="ring ring-a"></div>
        <div class="planet"></div>
        <div class="ring ring-b"></div>
        <div class="ring ring-d"></div>
    </div>

    <div class="core-info">
        <div class="core-title">C.H.U.C.K.</div>
        <div class="core-status" id="coreStatus">AWAITING COMMAND</div>
        <div class="core-line"></div>
    </div>
</section>

<!-- RESPONSES FLOAT OVER THE BACKGROUND -->

<section class="chat-feed" id="messages" aria-live="polite">
    <div class="message">
        <span class="msg-label">C.H.U.C.K. / CORE</span>
        Online and ready, Boss Wayne. Give me a command.
    </div>
</section>

<!-- ALL COMMAND CONTROLS STAY AT THE BOTTOM -->

<section class="bottom">
    <div class="bottom-inner">

        <div class="command-label">
            <span>COMMAND INPUT</span>
            <strong id="aiStatus">AI STANDBY</strong>
        </div>

        <form class="input-row" id="chatForm">
            <div class="input-wrap">
                <input
                    id="userInput"
                    type="text"
                    placeholder="Talk to C.H.U.C.K., Boss..."
                    autocomplete="off"
                    enterkeyhint="send"
                    aria-label="Enter your command"
                >
            </div>

            <button class="btn" type="button" id="micBtn"
                    aria-label="Record voice command" title="Record">
                🎙
            </button>

            <button class="btn send" type="submit"
                    aria-label="Send command" title="Send">
                ➤
            </button>
        </form>

        <div class="tools-row">
            <button class="tool" id="wakeBtn" type="button">
                <span>◉</span><span id="wakeLabel">WAKE WORD OFF</span>
            </button>
            <button class="tool" id="voiceBtn" type="button">
                <span>♫</span><span id="voiceLabel">VOICE ON</span>
            </button>
            <button class="tool" id="clearBtn" type="button">
                <span>⌫</span><span>CLEAR CHAT</span>
            </button>
        </div>

        <div class="footer">
            POWERED BY <span>C.H.U.C.K.</span> · COMMAND KERNEL
        </div>
    </div>
</section>

<script>
"use strict";

/* BACKEND */

const BACKEND_URL = "https://chuck-ai-backend.onrender.com/ask";

const $ = id => document.getElementById(id);

const messages = $("messages");
const input = $("userInput");
const micBtn = $("micBtn");
const wakeBtn = $("wakeBtn");
const voiceBtn = $("voiceBtn");
const orb = $("orbStage");

let busy = false;
let wakeMode = false;
let manualRecording = false;
let voiceEnabled = true;
let recognition = null;
let recognitionRunning = false;
let pendingRestart = false;
let restartTimer = null;

/* STAR FIELD */

(function createStars() {
    const container = $("stars");

    for (let i = 0; i < 65; i++) {
        const star = document.createElement("div");
        star.className = "star";
        star.style.left = (Math.random() * 100) + "%";
        star.style.top = (Math.random() * 100) + "%";
        star.style.animationDelay = (Math.random() * 4) + "s";
        star.style.animationDuration = (2 + Math.random() * 4) + "s";
        container.appendChild(star);
    }
})();

/* UI STATUS */

function setStatus(mode, label) {
    $("statusText").textContent = label;
    $("coreStatus").textContent =
        mode === "listening" ? "LISTENING FOR COMMANDS" :
        mode === "thinking" ? "PROCESSING REQUEST" :
        mode === "error" ? "CONNECTION INTERRUPTED" :
        wakeMode ? "WAKE WORD ACTIVE" : "AWAITING COMMAND";

    $("statusDot").className = "dot" +
        (mode === "thinking" ? " busy" : "");

    orb.classList.toggle("listening", mode === "listening");
    orb.classList.toggle("thinking", mode === "thinking");

    $("aiStatus").textContent =
        mode === "thinking" ? "PROCESSING..." :
        mode === "error" ? "CHECK CONNECTION" :
        mode === "listening" ? "VOICE ACTIVE" : "AI STANDBY";
}

/* CHAT */

function addMessage(text, sender = "ai") {
    const bubble = document.createElement("div");
    bubble.className = "message" + (sender === "user" ? " user" : "");

    const label = document.createElement("span");
    label.className = "msg-label";
    label.textContent = sender === "user"
        ? "BOSS WAYNE / COMMAND"
        : "C.H.U.C.K. / CORE";

    const body = document.createElement("div");
    body.textContent = String(text);

    bubble.append(label, body);
    messages.appendChild(bubble);
    messages.scrollTop = messages.scrollHeight;

    return bubble;
}

function showTyping() {
    const el = document.createElement("div");
    el.className = "typing";
    el.id = "typing";

    el.append(
        document.createTextNode("Thinking"),
        document.createElement("span"),
        document.createElement("span"),
        document.createElement("span")
    );

    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
}

function hideTyping() {
    $("typing")?.remove();
}

/* VOICE OUTPUT */

function speak(text) {
    if (!voiceEnabled || !("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(String(text));
    utterance.lang = "en-US";
    utterance.rate = 1;
    utterance.pitch = 0.85;

    const voices = speechSynthesis.getVoices();
    const selected = voices.find(v =>
        /david|mark|daniel|james|guy/i.test(v.name) &&
        /en/i.test(v.lang)
    ) || voices.find(v => /en/i.test(v.lang));

    if (selected) utterance.voice = selected;

    speechSynthesis.speak(utterance);
}

/* SEND TO YOUR EXISTING AI BACKEND */

async function sendMessage(raw) {
    const message = String(raw || "").trim();

    if (!message || busy) return;

    input.value = "";
    addMessage(message, "user");

    busy = true;
    setStatus("thinking", "THINKING");
    showTyping();

    try {
        let response;

        // Use the native Android bridge if your app exposes it.
        if (window.ChuckBridge &&
            typeof window.ChuckBridge.sendMessage === "function") {

            response = await new Promise((resolve, reject) => {
                const callbackId = "chuck_" + Date.now();

                const timeout = setTimeout(() => {
                    delete window[callbackId];
                    reject(new Error("Native request timed out"));
                }, 60000);

                window[callbackId] = result => {
                    clearTimeout(timeout);
                    delete window[callbackId];

                    try {
                        const obj = typeof result === "string"
                            ? JSON.parse(result) : result;

                        resolve(
                            typeof obj === "string" ? obj :
                            obj.reply ?? obj.response ?? obj.message
                        );
                    } catch {
                        resolve(result);
                    }
                };

                try {
                    window.ChuckBridge.sendMessage(message, callbackId);
                } catch (err) {
                    clearTimeout(timeout);
                    delete window[callbackId];
                    reject(err);
                }
            });

        } else {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 60000);

            try {
                const res = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message }),
                    signal: controller.signal
                });

                if (!res.ok) {
                    throw new Error("Backend HTTP " + res.status);
                }

                const data = await res.json();
                response = data.reply ?? data.response ?? data.message;

            } finally {
                clearTimeout(timeout);
            }
        }

        if (typeof response !== "string" || !response.trim()) {
            throw new Error("The backend returned no readable reply.");
        }

        addMessage(response, "ai");
        speak(response);

    } catch (err) {
        console.error("CHUCK:", err);

        const errorMessage = err.name === "AbortError"
            ? "The request timed out. The backend may be waking up."
            : "I couldn't connect to my AI backend, Boss Wayne. Check your connection and the /ask endpoint.";

        addMessage(errorMessage, "ai");
        setStatus("error", "CONNECTION ISSUE");

    } finally {
        hideTyping();
        busy = false;

        if (wakeMode || manualRecording) {
            setStatus("listening", "VOICE ACTIVE");
        } else if ($("statusText").textContent !== "CONNECTION ISSUE") {
            setStatus("ready", "CORE ONLINE");
        }
    }
}

/* VOICE RECOGNITION */

const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

function initializeVoice() {
    if (!SpeechRecognition) {
        $("aiStatus").textContent = "VOICE UNSUPPORTED";
        micBtn.disabled = true;
        micBtn.style.opacity = ".45";
        return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onstart = () => {
        recognitionRunning = true;
        setStatus("listening", "LISTENING");
        micBtn.classList.add("active");
    };

    recognition.onresult = event => {
        for (let i = event.resultIndex; i < event.results.length; i++) {
            if (!event.results[i].isFinal) continue;

            const transcript = event.results[i][0].transcript.trim();
            if (!transcript) continue;

            if (manualRecording) {
                manualRecording = false;
                stopRecognitionIfIdle();
                sendMessage(transcript);
                continue;
            }

            if (wakeMode) {
                const match = transcript.match(/\bchuck\b[\s,.:;-]*(.*)/i);

                if (match) {
                    const command = match[1].trim();

                    if (command) {
                        sendMessage(command);
                    } else {
                        addMessage("I'm listening, Boss Wayne. What's your command?", "ai");
                        speak("Yes, Boss Wayne. I'm listening.");
                    }
                }
            }
        }
    };

    recognition.onerror = event => {
        console.warn("Voice error:", event.error);

        if (event.error === "not-allowed" ||
            event.error === "service-not-allowed") {
            wakeMode = false;
            manualRecording = false;
            updateWakeButton();
            setStatus("error", "MIC PERMISSION");
        }
    };

    recognition.onend = () => {
        recognitionRunning = false;

        if (wakeMode || manualRecording) {
            pendingRestart = true;
            clearTimeout(restartTimer);

            restartTimer = setTimeout(() => {
                pendingRestart = false;
                startRecognition();
            }, 450);
        } else {
            micBtn.classList.remove("active");
            setStatus("ready", "CORE ONLINE");
        }
    };
}

function startRecognition() {
    if (!recognition || recognitionRunning) return;

    try {
        recognition.start();
    } catch (err) {
        console.warn("Could not start voice recognition:", err.message);
    }
}

function stopRecognitionIfIdle() {
    if (wakeMode || manualRecording) return;

    clearTimeout(restartTimer);

    if (recognition && recognitionRunning) {
        recognition.stop();
    }

    micBtn.classList.remove("active");
}

function updateWakeButton() {
    $("wakeLabel").textContent = wakeMode ? "WAKE WORD ON" : "WAKE WORD OFF";
    wakeBtn.classList.toggle("active", wakeMode);
}

micBtn.addEventListener("click", () => {
    if (!recognition) {
        addMessage("Voice recognition is not supported in this browser.", "ai");
        return;
    }

    if (manualRecording) {
        manualRecording = false;
        micBtn.classList.remove("active");
        stopRecognitionIfIdle();
        return;
    }

    // A manual recording takes priority over wake-word mode.
    manualRecording = true;
    micBtn.classList.add("active");

    if (!recognitionRunning) {
        startRecognition();
    } else {
        setStatus("listening", "LISTENING");
    }
});

wakeBtn.addEventListener("click", () => {
    if (!recognition) {
        addMessage("Wake-word recognition is not supported by this browser.", "ai");
        return;
    }

    wakeMode = !wakeMode;
    manualRecording = false;

    updateWakeButton();
    micBtn.classList.toggle("active", wakeMode);

    if (wakeMode) {
        startRecognition();
        addMessage(
            'Wake-word mode enabled. Say "CHUCK" followed by your command while this page is active.',
            "ai"
        );
    } else {
        stopRecognitionIfIdle();
        addMessage("Wake-word mode disabled.", "ai");
        setStatus("ready", "CORE ONLINE");
    }
});

/* BOTTOM CONTROLS */

$("chatForm").addEventListener("submit", event => {
    event.preventDefault();
    sendMessage(input.value);
});

voiceBtn.addEventListener("click", () => {
    voiceEnabled = !voiceEnabled;

    $("voiceLabel").textContent = voiceEnabled ? "VOICE ON" : "VOICE OFF";
    voiceBtn.classList.toggle("active", voiceEnabled);

    if (!voiceEnabled && "speechSynthesis" in window) {
        speechSynthesis.cancel();
    }
});

$("clearBtn").addEventListener("click", () => {
    messages.replaceChildren();
    addMessage("Channel cleared, Boss Wayne. Awaiting your next command.", "ai");
});

/* START */

initializeVoice();
setStatus("ready", "CORE ONLINE");
updateWakeButton();
</script>
